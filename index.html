<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer Information Sheet</title>

<style>
*{box-sizing:border-box}

body{
  font-family:Arial,sans-serif;
  background:#eef2f7;
  margin:0;
  color:#222;
}

header{
  background:#173e68;
  color:white;
  padding:16px;
  text-align:center;
}

.container{
  max-width:900px;
  margin:20px auto;
  padding:15px;
}

.form{
  background:white;
  padding:20px;
  border-radius:8px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;
}

label{
  font-weight:bold;
  font-size:13px;
}

input,textarea{
  width:100%;
  padding:10px;
  border:1px solid #bbb;
  border-radius:5px;
  margin-top:5px;
  font:inherit;
}

textarea{min-height:65px}
.full{grid-column:1/-1}

button{
  padding:11px 18px;
  border:0;
  border-radius:5px;
  background:#174f83;
  color:white;
  font-weight:bold;
  margin:12px 5px 0 0;
  cursor:pointer;
}

.secondary{background:#64748b}

/* PRINT AREA */

#preview{
  background:white;
  margin-top:20px;
  padding:25px;
  border:1px solid #bbb;
}

.print-logo{
  display:block;
  width:520px;
  max-width:95%;
  height:125px;
  object-fit:contain;
  margin:0 auto 65px;
}

.branch-section{
  margin:0 12px 45px;
  font-size:13px;
  line-height:1.7;
}

.branch-row{
  display:flex;
  margin-bottom:12px;
}

.branch-label{
  width:145px;
  flex-shrink:0;
}

.branch-value{
  flex:1;
  overflow-wrap:anywhere;
  white-space:pre-line;
}

.ifsc-row{
  margin-top:55px;
}

.section-title{
  font-size:13px;
  font-weight:bold;
  margin:0 12px 28px;
}

.customer-details{
  display:flex;
  flex-direction:column;
  gap:18px;
  margin:0 12px;
}

.detail{
  display:flex;
  font-size:13px;
  line-height:1.6;
}

.detail b{
  font-weight:normal;
  width:145px;
  flex-shrink:0;
}

.detail span{
  font-weight:normal;
  flex:1;
  overflow-wrap:anywhere;
  white-space:pre-line;
}

.signature{
  margin:auto 15px 0;
  padding-top:110px;
  text-align:right;
  font-size:12px;
}

.signature-line{
  display:inline-block;
  width:175px;
  border-top:1px solid #555;
  padding-top:7px;
  text-align:center;
}

.website{
  margin-top:55px;
  text-align:center;
  font-size:9px;
  color:#555;
  overflow-wrap:anywhere;
}

.unofficial-note{
  margin-top:10px;
  text-align:center;
  font-size:9px;
  color:#8a2222;
}

@media(max-width:600px){
  .grid{grid-template-columns:1fr}
  .full{grid-column:auto}

  .branch-row,.detail{font-size:11px}
  .branch-label,.detail b{width:125px}

  .print-logo{height:100px}
}

@page{
  size:A4 portrait;
  margin:15mm;
}

@media print{
  body{background:white}

  header,.form,.no-print{
    display:none!important;
  }

  .container{
    margin:0;
    padding:0;
    max-width:none;
  }

  #preview{
    border:0;
    margin:0;
    padding:5mm 3mm;
    min-height:267mm;
    height:267mm;
    display:flex;
    flex-direction:column;
    page-break-inside:avoid;
  }

  .print-logo{
    width:520px;
    max-width:95%;
    height:125px;
    margin-bottom:65px;
  }

  .branch-section{margin-bottom:45px}
  .signature{padding-top:0}
  .website{margin-top:35px}
}
</style>
</head>

<body>

<header>
<h2>Customer Information Sheet</h2>
<p>Print Management</p>
</header>

<div class="container">

<div class="form">

<h3>Customer Details Entry</h3>

<div class="grid">

<div>
<label>Bank Name</label>
<input id="bank" value="Union Bank of India">
</div>

<div>
<label>Branch Name</label>
<input id="branch" value="PULINDA">
</div>

<div>
<label>Branch Address</label>
<textarea id="branchaddress">AT AND PULINDA,
DIST- MURSHIDABAD, WEST BENGAL, 742134</textarea>
</div>
<div>
<label>Branch Phone</label>
<input id="phone" value="03482-232216">
</div>
<div>
<label>IFSC Code</label>
<input id="ifsc" value="UBIN0546844">
</div>
<div>
<label>Customer Name</label>
<input id="name">
</div>
<div>
<label>Father / Guardian Name</label>
<input id="father">
</div>

<div>
<label>Account Number</label>
<input id="account">
</div>

<div>
<label>Customer ID / CIF</label>
<input id="cif">
</div>

<div>
<label>Aadhaar - Last 4 Digits Only</label>
<input id="aadhaar" maxlength="4" inputmode="numeric">
</div>

<div>
<label>Mobile - Last 4 Digits Only</label>
<input id="mobile" maxlength="4" inputmode="numeric">
</div>

<div>
<label>Occupation</label>
<input id="occupation">
</div>

<div>
<label>Opening Balance</label>
<input id="balance">
</div>

<div class="full">
<label>Customer Address</label>
<textarea id="address"></textarea>
</div>

</div>

<button onclick="updatePreview()">Update Preview</button>
<button onclick="window.print()">Print / Save PDF</button>
<button class="secondary" onclick="clearForm()">Clear Form</button>

</div>

<!-- PRINT AREA -->

<div id="preview">

<img
class="print-logo"
src="WhatsApp%20Image%202026-11-16%20at%2012.22.44%20PM.jpg"
alt="Uploaded image"
onerror="this.style.display='none'">

<div class="branch-section">

<div class="branch-row">
<div class="branch-label">BRANCH :</div>
<div class="branch-value" id="pbranch"></div>
</div>

<div class="branch-row">
<div class="branch-label">Branch Address:</div>
<div class="branch-value" id="pbranchaddress"></div>
</div>

<div class="branch-row">
<div class="branch-label">Branch Phone:</div>
<div class="branch-value" id="pphone"></div>
</div>

<div class="branch-row ifsc-row">
<div class="branch-label">IFSC Code:</div>
<div class="branch-value" id="pifsc"></div>
</div>

</div>

<div class="section-title">CUSTOMER DETAILS</div>

<div class="customer-details" id="details"></div>

<div class="signature">
<div class="signature-line">
Customer Signature
</div>
</div>

<div class="website">
Website: <span id="pwebsite"></span>
</div>

<div class="unofficial-note">
PERSONAL RECORD ONLY — NOT A BANK-ISSUED DOCUMENT
</div>

</div>
</div>

<script>

const fields=[
["Account No.","account"],
["Customer ID","cif"],
["Name","name"],
["Father / Guardian Name","father"],
["Aadhaar (Last 4 Digits)","aadhaar"],
["Mobile (Last 4 Digits)","mobile"],
["Occupation","occupation"],
["Opening Balance","balance"],
["Address","address"]
];

function get(id){
return document.getElementById(id).value.trim();
}

function safe(text){
return text.replace(/[&<>"']/g,c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[c]));
}

function updatePreview(){

document.getElementById("pbranch").textContent=
get("branch");

document.getElementById("pbranchaddress").textContent=
get("branchaddress");

document.getElementById("pphone").textContent=
get("phone");

document.getElementById("pifsc").textContent=
get("ifsc");

let html="";

fields.forEach(([label,id])=>{

let value=get(id);

if(!value)return;

if(id==="aadhaar"){
value="XXXX XXXX "+value;
}

if(id==="mobile"){
value="******"+value;
}

html+=`
<div class="detail">
<b>${label} :</b>
<span>${safe(value)}</span>
</div>`;

});

document.getElementById("details").innerHTML=html;

document.getElementById("pwebsite").textContent=
window.location.href;

}

["aadhaar","mobile"].forEach(id=>{
document.getElementById(id).addEventListener("input",function(){
this.value=this.value.replace(/\D/g,"").slice(0,4);
});
});

function clearForm(){

document.querySelectorAll(".form input,.form textarea")
.forEach(el=>el.value="");

document.getElementById("bank").value="Union Bank of India";
document.getElementById("branch").value="PULINDA";

document.getElementById("branchaddress").value=
"AT AND PULINDA,\nDIST- MURSHIDABAD, WEST BENGAL, 742134";

document.getElementById("phone").value="03482-232216";
document.getElementById("ifsc").value="UBIN0546844";

updatePreview();
}

updatePreview();

</script>

</body>
</html>

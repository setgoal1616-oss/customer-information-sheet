<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Information Sheet</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#eef2f7;margin:0;color:#172b43}
header{background:#173e68;color:white;padding:20px;text-align:center}
.container{max-width:900px;margin:20px auto;padding:15px}
.card{background:white;padding:20px;border-radius:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
label{font-weight:bold;font-size:13px}
input,textarea{width:100%;padding:10px;border:1px solid #bbb;border-radius:5px;margin-top:5px}
textarea{min-height:65px}
.full{grid-column:1/-1}
button{padding:11px 17px;border:0;border-radius:5px;background:#174f83;color:white;font-weight:bold;margin:12px 5px 0 0;cursor:pointer}
.secondary{background:#64748b}
#preview{background:white;margin-top:20px;padding:20px;border:1px solid #bbb}
#preview h2{text-align:center;margin:0}
.subtitle{text-align:center;font-size:11px;margin:6px}
.notice{text-align:center;border:1px solid #444;padding:6px;font-size:11px;font-weight:bold;margin:12px 0}
.details{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item{border-bottom:1px solid #aaa;padding:7px;overflow-wrap:anywhere}
.item b{display:block;font-size:10px;color:#555;margin-bottom:4px}
.item span{font-size:13px}
@media(max-width:600px){
.grid,.details{grid-template-columns:1fr}
.full{grid-column:auto}
}
@page{size:A4;margin:12mm}
@media print{
body{background:white}
header,.form,.no-print{display:none!important}
.container{margin:0;padding:0}
#preview{border:1px solid #333;margin:0;padding:20px;min-height:260mm}
}
</style>
</head>
<body>

<header>
<h2>Customer Information Sheet</h2>
<p>Personal Customer Record</p>
</header>

<div class="container">

<div class="card form">
<h3>Enter Customer Details</h3>

<div class="grid">

<div>
<label>Bank Name</label>
<input id="bank" value="Union Bank of India">
</div>

<div>
<label>Branch Name</label>
<input id="branch" value="PULINDA">
</div>

<div>
<label>Customer Name</label>
<input id="name">
</div>

<div>
<label>Father / Guardian Name</label>
<input id="father">
</div>

<div>
<label>Account Number</label>
<input id="account">
</div>

<div>
<label>Customer ID / CIF</label>
<input id="cif">
</div>

<div>
<label>Aadhaar - Last 4 Digits Only</label>
<input id="aadhaar" maxlength="4" inputmode="numeric" placeholder="Last 4 digits">
</div>

<div>
<label>Mobile - Last 4 Digits Only</label>
<input id="mobile" maxlength="4" inputmode="numeric" placeholder="Last 4 digits">
</div>

<div>
<label>PAN Number</label>
<input id="pan">
</div>

<div>
<label>Issue Date</label>
<input id="date" type="date">
</div>

<div>
<label>Nominee Name</label>
<input id="nominee">
</div>

<div>
<label>Opening Balance</label>
<input id="balance">
</div>

<div class="full">
<label>Customer Address</label>
<textarea id="address"></textarea>
</div>

<div class="full">
<label>Branch Address</label>
<textarea id="branchaddress">AT AND POST PULINDA,
DIST. MURSHIDABAD, WEST BENGAL
03482-232216</textarea>
</div>

</div>

<button onclick="updatePreview()">Update Preview</button>
<button onclick="window.print()">Print / Save PDF</button>
<button class="secondary" onclick="clearForm()">Clear Form</button>

</div>

<div id="preview">

<h2 id="pbank">Union Bank of India</h2>
<div class="subtitle">CUSTOMER INFORMATION SHEET</div>

<div class="notice">
PERSONAL RECORD – NOT AN OFFICIAL BANK PASSBOOK
</div>

<div class="details" id="details"></div>

<p style="font-size:10px;margin-top:25px">
This is a personal customer information sheet. Please verify account information with your bank.
</p>

</div>
</div>

<script>
const fields=[
["Branch","branch"],
["Customer Name","name"],
["Father / Guardian Name","father"],
["Account Number","account"],
["Customer ID / CIF","cif"],
["Aadhaar Number","aadhaar"],
["Mobile Number","mobile"],
["PAN Number","pan"],
["Issue Date","date"],
["Nominee Name","nominee"],
["Opening Balance","balance"],
["Customer Address","address"],
["Branch Address","branchaddress"]
];

function clean(id){
return document.getElementById(id).value.trim();
}

function escapeHTML(value){
return value.replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",
'"':"&quot;","'":"&#39;"
}[c]));
}

function updatePreview(){

document.getElementById("pbank").textContent=
clean("bank") || "Customer Information";

let html="";

fields.forEach(([label,id])=>{

let value=clean(id);

if(id==="aadhaar"){
value="XXXX XXXX "+(value||"----");
}

if(id==="mobile"){
value="******"+(value||"----");
}

if(id==="date" && value){
value=value.split("-").reverse().join("-");
}

if(!value)value="—";

html+=`
<div class="item">
<b>${label}</b>
<span>${escapeHTML(value).replace(/\n/g,"<br>")}</span>
</div>`;
});

document.getElementById("details").innerHTML=html;
}

["aadhaar","mobile"].forEach(id=>{
document.getElementById(id).addEventListener("input",function(){
this.value=this.value.replace(/\D/g,"").slice(0,4);
});
});

function clearForm(){
document.querySelectorAll(".form input,.form textarea")
.forEach(el=>el.value="");
document.getElementById("bank").value="Union Bank of India";
document.getElementById("branch").value="PULINDA";
document.getElementById("branchaddress").value=
"AT AND POST PULINDA,\nDIST. MURSHIDABAD, WEST BENGAL\n03482-232216";
updatePreview();
}

updatePreview();
</script>

</body>
</html>

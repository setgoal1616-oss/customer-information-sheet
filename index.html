<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal Passbook Cover</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #eeeeee;
    font-family: Arial, sans-serif;
}

.editor {
    max-width: 700px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 8px;
}

.editor h2 {
    text-align: center;
}

.editor label {
    display: block;
    margin-top: 12px;
    font-weight: bold;
}

.editor input {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border: 1px solid #aaa;
    border-radius: 4px;
}

button {
    padding: 12px 20px;
    background: #064b8d;
    color: white;
    border: none;
    border-radius: 5px;
    margin-top: 15px;
    cursor: pointer;
}

.preview {
    width: 210mm;
    height: 297mm;
    background: white;
    margin: 25px auto;
    position: relative;
    color: #000;
    overflow: hidden;
}

/* Top Disclaimer */
.disclaimer {
    position: absolute;
    top: 1mm;
    left: 0;
    width: 100%;
    text-align: center;
    font-size: 9px;
    font-weight: bold;
}

/* Main Content - 19 CM */
.main-content {
    position: absolute;
    top: 12mm;
    left: 10mm;
    width: 190mm;
    height: 190mm;
    border: 1px solid #333;
    padding: 5mm;
}

/* Bank Logo */
.logo {
    text-align: center;
    height: 25mm;
    margin-bottom: 3mm;
}

.logo img {
    max-height: 23mm;
    max-width: 65mm;
    object-fit: contain;
}

/* Bank Name */
.bank-name {
    text-align: center;
    font-size: 21px;
    font-weight: bold;
    margin: 4mm 0;
}

/* Customer Details */
.details {
    font-size: 13px;
    line-height: 2;
}

.details div {
    border-bottom: 1px dotted #888;
    min-height: 10mm;
}

/* Signature */
.signature-area {
    display: flex;
    justify-content: space-between;
    margin-top: 20mm;
    font-size: 12px;
}

/* Website at Bottom */
.website {
    position: absolute;
    bottom: 1mm;
    width: 100%;
    text-align: center;
    font-size: 10px;
    font-weight: bold;
}

@media print {
    @page {
        size: A4 portrait;
        margin: 0;
    }

    html, body {
        margin: 0;
        padding: 0;
        background: white;
    }

    .editor {
        display: none !important;
    }

    .preview {
        margin: 0;
        width: 210mm;
        height: 297mm;
        page-break-after: avoid;
    }
}
</style>
</head>

<body>

<div class="editor">

    <h2>Passbook Cover Generator</h2>

    <label>Bank Logo Upload</label>
    <input type="file" id="logoInput" accept="image/*">

    <label>Account Holder Name</label>
    <input id="holder" placeholder="Enter Name">

    <label>Father / Guardian Name</label>
    <input id="father" placeholder="Enter Father / Guardian Name">

    <label>Account Number (First 11 Digits)</label>
    <input value="46840212000" readonly>

    <label>Last 4 Digits</label>
    <input
        id="lastFour"
        maxlength="4"
        inputmode="numeric"
        pattern="[0-9]{4}"
        placeholder="Enter Last 4 Digits">

    <label>Customer ID (9 Digits)</label>
    <input
        id="customerId"
        maxlength="9"
        inputmode="numeric"
        pattern="[0-9]{9}"
        placeholder="Enter 9 Digit Customer ID">

    <label>Branch Name</label>
    <input id="branch" placeholder="Enter Branch">

    <label>IFSC Code</label>
    <input id="ifsc" placeholder="Enter IFSC">

    <label>Website Link</label>
    <input
        id="websiteInput"
        value="https://yourwebsite.com">

    <button onclick="updatePreview()">
        Update Preview
    </button>

    <button onclick="window.print()">
        Print A4
    </button>

</div>


<!-- PRINT PAGE -->

<div class="preview">

    <!-- TOP DISCLAIMER -->
    <div class="disclaimer">
        CUSTOMER-PREPARED COPY — NOT BANK VERIFIED
    </div>


    <!-- MAIN CONTENT 19 CM -->
    <div class="main-content">

        <!-- BANK LOGO -->
        <div class="logo">
            <img id="bankLogo" src="" alt="Bank Logo">
        </div>

        <!-- BANK NAME -->
        <div class="bank-name">
            UNION BANK OF INDIA
        </div>

        <!-- CUSTOMER DETAILS -->
        <div class="details">

            <div>
                Account Holder:
                <span id="pHolder"></span>
            </div>

            <div>
                Father / Guardian:
                <span id="pFather"></span>
            </div>

            <div>
                Account Number:
                <span id="pAccount"></span>
            </div>

            <div>
                Customer ID:
                <span id="pCustomerId"></span>
            </div>

            <div>
                Branch:
                <span id="pBranch"></span>
            </div>

            <div>
                IFSC Code:
                <span id="pIfsc"></span>
            </div>

        </div>

        <!-- SIGNATURE -->
        <div class="signature-area">

            <span>Customer Signature</span>

            <span>হিসাব রক্ষক</span>

        </div>

    </div>


    <!-- WEBSITE BOTTOM -->
    <div class="website" id="pWebsite">
        https://yourwebsite.com
    </div>

</div>


<script>

// Update Preview
function updatePreview() {

    document.getElementById("pHolder").textContent =
        document.getElementById("holder").value;

    document.getElementById("pFather").textContent =
        document.getElementById("father").value;

    document.getElementById("pBranch").textContent =
        document.getElementById("branch").value;

    document.getElementById("pIfsc").textContent =
        document.getElementById("ifsc").value;


    // Account Number
    const lastFour =
        document.getElementById("lastFour").value;

    document.getElementById("pAccount").textContent =
        /^\d{4}$/.test(lastFour)
        ? "46840212000" + lastFour
        : "46840212000";


    // Customer ID - Exactly 9 Digits
    const customerId =
        document.getElementById("customerId").value;

    document.getElementById("pCustomerId").textContent =
        /^\d{9}$/.test(customerId)
        ? customerId
        : "";


    // Website Link
    document.getElementById("pWebsite").textContent =
        document.getElementById("websiteInput").value;

}


// Logo Upload
document.getElementById("logoInput").addEventListener(
    "change",
    function(event) {

        const file = event.target.files[0];

        if (file) {

            const reader = new FileReader();

            reader.onload = function(e) {

                document.getElementById("bankLogo").src =
                    e.target.result;

            };

            reader.readAsDataURL(file);

        }

    }
);


// Allow Only Numbers
document.getElementById("lastFour").addEventListener(
    "input",
    function() {
        this.value = this.value.replace(/\D/g, "").slice(0, 4);
    }
);

document.getElementById("customerId").addEventListener(
    "input",
    function() {
        this.value = this.value.replace(/\D/g, "").slice(0, 9);
    }
);


// Initial Preview
updatePreview();

</script>

</body>
</html>
